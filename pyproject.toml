[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k-resdev-skill"
version = "0.1.0b59"
description = "K-ResDev GPT/Codex agent skill pack with an optional Korean R&D evidence verification core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4",
  "pydantic>=2.8",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
k-resdev = "k_resdev_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
